<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Magic Birthday Portal ✨</title>

<link
    rel="stylesheet"
    href="present.css"
>
```

</head>

<body>

```
<!-- Moving stars -->

<div class="stars">

    <span>✨</span>
    <span>⭐</span>
    <span>💖</span>
    <span>✨</span>
    <span>🌟</span>
    <span>💗</span>
    <span>⭐</span>
    <span>✨</span>

</div>


<!-- Main content -->

<main class="portal-page">


    <p class="small-title">

        ✨ A SPECIAL MAGIC HAS APPEARED ✨

    </p>


    <h1>

        Your Birthday Portal
        <br>
        Is Now Open! 💖

    </h1>


    <p class="message">

        A special birthday surprise is waiting
        on the other side...

    </p>


    <!-- Magic portal -->

    <div
        class="portal-container"
        id="portal"
    >


        <div class="portal-glow"></div>


        <div class="portal-ring ring-one"></div>


        <div class="portal-ring ring-two"></div>


        <div class="portal-ring ring-three"></div>


        <div class="portal-center">

            <span>

                🎂

            </span>

        </div>


    </div>


    <!-- Enter button -->

    <button
        id="enterButton"
    >

        Enter the Birthday Portal 🌌

    </button>


    <p class="bottom-text">

        Click the portal and discover your surprise ✨

    </p>


</main>


<!-- Flash effect -->

<div
    class="flash"
    id="flash"
></div>


<script
    src="present.js"
></script>
```

</body>

</html>
