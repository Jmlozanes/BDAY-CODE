<!-- Passcode.html -->

<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Enter Passcode 🔐</title>

<link
    rel="stylesheet"
    href="Passcode.css"
>


</head>

<body>


<!-- Background decorations -->

<div class="heart heart1">💗</div>

<div class="heart heart2">✨</div>

<div class="heart heart3">💖</div>


<!-- Phone -->

<main class="phone">


    <!-- Phone camera -->

    <div class="camera">

        <div class="speaker"></div>

        <div class="camera-dot"></div>

    </div>


    <!-- Lock icon -->

    <div class="lock-icon">

        🔒

    </div>


    <h1>
        Birthday Lock
    </h1>


    <p class="instruction">

        Enter the special birthday date 🎂

    </p>


    <!-- Six passcode boxes -->

    <div class="passcode-boxes">

        <div class="box"></div>

        <div class="box"></div>

        <div class="box"></div>

        <div class="box"></div>

        <div class="box"></div>

        <div class="box"></div>

    </div>


    <p class="hint">

        Hint: MMDDYY 💕
        
    </p>


    <!-- Number keypad -->

    <div class="keypad">


        <button class="key" data-number="1">
            1
        </button>


        <button class="key" data-number="2">
            2
        </button>


        <button class="key" data-number="3">
            3
        </button>


        <button class="key" data-number="4">
            4
        </button>


        <button class="key" data-number="5">
            5
        </button>


        <button class="key" data-number="6">
            6
        </button>


        <button class="key" data-number="7">
            7
        </button>


        <button class="key" data-number="8">
            8
        </button>


        <button class="key" data-number="9">
            9
        </button>


        <button class="key" data-number="*">
            *
        </button>


        <button class="key" data-number="0">
            0
        </button>


        <button class="key" data-number="#">
            #
        </button>


    </div>


    <!-- Delete button -->

    <button
        id="deleteButton"
    >

        ⌫ Delete

    </button>


</main>


<!-- Wrong password popup -->

<div
    class="popup-background"
    id="popup"
>


    <div class="popup">


        <div class="angry-cat">

            😾

        </div>


        <h2>

            Wrong Birthday Date!

        </h2>


        <p>

            Try again! 😾💢

        </p>


        <button
            id="tryAgain"
        >

            Try Again 💖

        </button>


    </div>


</div>


<script
    src="Passcode.js"
></script>
```

</body>

</html>
