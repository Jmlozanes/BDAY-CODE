<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aimee's Birthday Surprise</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="overlay"></div>


<div class="sparkles">

<span></span>
<span></span>
<span></span>

</div>



<main class="loading-container">


<div class="cake-container">

<img 
src="cake.png"
class="cake"
alt="Birthday Cake">

</div>



<h1>
Something Special Is Coming
</h1>



<p>
Please wait for your birthday surprise
</p>




<div class="number-box">

<span id="count">
1
</span>

<span class="total">
/ 10
</span>

</div>




<div class="progress-container">

<div 
class="progress-bar"
id="progressBar">

</div>

</div>




<p class="loading-text">

Preparing your surprise...

</p>


</main>




<script src="script.js"></script>


</body>

</html>
